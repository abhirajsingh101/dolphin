name: Desktop

# Builds Dolphin Desktop for Linux and macOS, and smoke-tests each build the
# way a new user meets it: a frozen helper in a scratch home, then the packaged
# app's first run with an empty HOME and no repository on the machine.
#
# PyInstaller cannot cross-compile, so every helper is built on its own
# platform. Each app then carries all of them: its own, unpacked, to run here,
# and every .tar.xz, to upload to SSH hosts of any platform.
#
# Runs on a desktop-v* tag (and drafts a release) or by hand. macOS minutes
# cost ten times Linux ones, so ordinary pushes do not run it; ci.yml covers
# the code itself.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Helper (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04's older glibc is what lets the Linux helpers run on older hosts.
        # Linux arm64 (for SSH machines such as Graviton, Ampere or a Raspberry
        # Pi) builds where GitHub's arm64 runners are free: public repositories.
        include: ${{ fromJSON(github.event.repository.private
          && '[{"target":"linux-x64","os":"ubuntu-22.04"},{"target":"darwin-arm64","os":"macos-15"},{"target":"darwin-x64","os":"macos-15-intel"}]'
          || '[{"target":"linux-x64","os":"ubuntu-22.04"},{"target":"linux-arm64","os":"ubuntu-22.04-arm"},{"target":"darwin-arm64","os":"macos-15"},{"target":"darwin-x64","os":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dolphin-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the helper (and tmux for hosts without one)
        env:
          PYTHON: python
        run: ./scripts/build-helper.sh

      - name: Smoke-test the helper with the host's tmux, if it has one, and its memory
        run: ./scripts/smoke-helper.sh helper-bundles/${{ matrix.target }}

      - name: Smoke-test the helper with the bundled tmux
        env:
          DOLPHIN_FORCE_BUNDLED_TMUX: '1'
          DOLPHIN_GBRAIN: 'off'  # memory was checked by the run above
        run: ./scripts/smoke-helper.sh helper-bundles/${{ matrix.target }}

      # Only the tarball: artifacts drop the executable bit, tar keeps it.
      - uses: actions/upload-artifact@v7
        with:
          name: helper-${{ matrix.target }}
          path: dolphin-desktop/helper-bundles/${{ matrix.target }}.tar.xz
          if-no-files-found: error

  app:
    name: App (${{ matrix.target }})
    needs: helper
    strategy:
      fail-fast: false
      matrix:
        # Linux arm64 builds where GitHub's arm64 runners are free: public repositories.
        include: ${{ fromJSON(github.event.repository.private
          && '[{"target":"linux-x64","os":"ubuntu-22.04"},{"target":"darwin-arm64","os":"macos-15"},{"target":"darwin-x64","os":"macos-15-intel"}]'
          || '[{"target":"linux-x64","os":"ubuntu-22.04"},{"target":"linux-arm64","os":"ubuntu-22.04-arm"},{"target":"darwin-arm64","os":"macos-15"},{"target":"darwin-x64","os":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            dolphin-web/package-lock.json
            dolphin-desktop/package-lock.json

      - uses: actions/download-artifact@v7
        with:
          pattern: helper-*
          merge-multiple: true
          path: dolphin-desktop/helper-bundles

      - name: Unpack this platform's helper
        working-directory: dolphin-desktop/helper-bundles
        run: |
          mkdir -p ${{ matrix.target }}
          tar -xJf ${{ matrix.target }}.tar.xz -C ${{ matrix.target }}
          ls -la

      - name: Install dependencies
        run: |
          npm ci --prefix dolphin-web
          npm ci --prefix dolphin-desktop

      # Signed and notarised on macOS when these repository secrets exist:
      #   MAC_CERTIFICATE (base64 .p12 of a Developer ID Application cert),
      #   MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
      #   APPLE_TEAM_ID. Without them the build is unsigned, as before.
      - name: Package
        working-directory: dolphin-desktop
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -yq rpm; fi  # rpmbuild, for the rpm target
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            # dolphinSigned: the app may then update itself in place (src/updates.ts).
            npm run dist -- -c.mac.notarize=true -c.extraMetadata.dolphinSigned=true
          elif [ "$RUNNER_OS" = macOS ]; then
            # Ad-hoc signed: Apple Silicon calls a downloaded app with no
            # signature at all "damaged" and offers no way to open it.
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist -- -c.mac.identity=-
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist
          fi

      - name: Check the installers' names
        working-directory: dolphin-desktop
        run: node scripts/check-artifacts.mjs release ${{ matrix.target }}

      - name: First run on a clean machine (Linux)
        if: runner.os == 'Linux'
        working-directory: dolphin-desktop
        env:
          DOLPHIN_SHOTS: ${{ runner.temp }}/shots
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb ffmpeg
          mkdir -p "$DOLPHIN_SHOTS"
          DOLPHIN_DESKTOP_APP="$(ls -d "$PWD"/release/linux*-unpacked)/dolphin-desktop" xvfb-run -a node --test test/packaged.test.mjs
          # The README's hero, from this clean run's screenshots (one target is enough).
          if [ "${{ matrix.target }}" = linux-x64 ]; then ./scripts/make-hero.sh "$DOLPHIN_SHOTS" "$DOLPHIN_SHOTS/dolphin-hero.gif"; fi

      - name: First run on a clean machine (macOS)
        if: runner.os == 'macOS'
        working-directory: dolphin-desktop
        env:
          DOLPHIN_SHOTS: ${{ runner.temp }}/shots
        run: |
          app="$(ls -d "$PWD"/release/mac*/Dolphin.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$DOLPHIN_SHOTS"
          DOLPHIN_DESKTOP_APP="$app/Contents/MacOS/Dolphin" node --test test/packaged.test.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-run-${{ matrix.target }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.target }}
          # latest-linux*.yml is what an installed AppImage reads to update itself;
          # the Mac feed is written by the release job for both architectures.
          path: |
            dolphin-desktop/release/*.AppImage
            dolphin-desktop/release/*.deb
            dolphin-desktop/release/*.rpm
            dolphin-desktop/release/*.dmg
            dolphin-desktop/release/*.zip
            dolphin-desktop/release/*.blockmap
            dolphin-desktop/release/*-linux*.yml
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v7
        with:
          pattern: app-*
          merge-multiple: true
          path: release

      # The hero comes only from the clean Linux x64 first run; without it the
      # release is still made (see the copy below).
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: first-run-linux-x64
          path: shots

      - name: Mac update feed and Homebrew cask
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          node dolphin-desktop/scripts/mac-update-feed.mjs release "$version"
          # Stable releases only; the tap is updated by hand (docs/desktop.md, "Homebrew").
          case "$version" in *-*) ;; *) node dolphin-desktop/scripts/render-cask.mjs release "$version" > release/dolphin-desktop.rb ;; esac
          # The README's hero (public/overlay/README.md); a missing one is skipped, not fatal.
          if [ -f shots/dolphin-hero.gif ]; then cp shots/dolphin-hero.gif release/; else echo "::notice::No dolphin-hero.gif from the Linux x64 first run; the release has no hero"; fi

      # Notes: dolphin-desktop/release-notes/<version>.md when it exists (the
      # What's New toast links this release's page), else GitHub's own. A
      # version with a prerelease part (0.2.1-beta.1) is a GitHub prerelease,
      # which only the beta channel offers.
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="dolphin-desktop/release-notes/$version.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          case "$version" in *-*) args+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --draft --title "Dolphin ${version}" "${args[@]}"
