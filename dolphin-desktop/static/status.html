<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dolphin</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <img src="dolphin-icon.png" alt="">
    <h1>Dolphin</h1>
    <p id="status" role="status" aria-live="polite">Opening…</p>
  </main>
  <script>
    const status = document.getElementById('status');
    window.setStatus = (text) => { status.textContent = text; };
    if (location.hash) status.textContent = decodeURIComponent(location.hash.slice(1));
  </script>
</body>
</html>
