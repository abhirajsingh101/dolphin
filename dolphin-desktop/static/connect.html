<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Connect to Machine</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="card">
    <div class="prompt-head">
      <span class="prompt-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></svg>
      </span>
      <div>
        <h2>Connect to Machine</h2>
        <p>Pick a machine or type its address. Dolphin uses your SSH keys, sets itself up there, and stays connected.</p>
      </div>
    </div>
    <form id="form">
      <label for="target" hidden>Host</label>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg>
        <input id="target" placeholder="gpu-box, user@10.0.0.5 or ssh://user@host:2222" autocomplete="off" autofocus aria-label="SSH host">
      </div>
      <button type="submit" id="connect">Connect</button>
    </form>
    <p id="error" class="error" role="alert"></p>
    <p class="hosts-title" id="hosts-title" hidden>Found on this computer</p>
    <ul id="hosts" aria-label="Machines found on this computer"></ul>
  </main>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('target');
    const error = document.getElementById('error');
    const button = document.getElementById('connect');
    const serverIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></svg>';
    function busy(on) {
      button.disabled = on;
      input.disabled = on;
      for (const host of document.querySelectorAll('button.host')) host.disabled = on;
      button.innerHTML = on ? '<span class="spinner" aria-hidden="true"></span> Connecting' : 'Connect';
    }
    async function connect(target) {
      error.textContent = '';
      busy(true);
      try {
        const result = await window.dolphinDesktop.connect(target.trim());
        if (result && result.error) error.textContent = result.error;
      } finally {
        busy(false);
      }
    }
    form.addEventListener('submit', (event) => { event.preventDefault(); if (input.value.trim()) connect(input.value); });
    // Recent machines, ~/.ssh/config, shell history, the tailnet, known_hosts (machines.ts).
    const where = { recent: 'Recent', config: 'SSH config', history: 'Shell history', tailscale: 'Tailscale', known: 'Known host' };
    window.dolphinDesktop.machines().then((machines) => {
      const list = document.getElementById('hosts');
      document.getElementById('hosts-title').hidden = machines.length === 0;
      for (const machine of machines.slice(0, 8)) {
        const item = document.createElement('li');
        const choice = document.createElement('button');
        choice.className = 'host';
        choice.innerHTML = serverIcon;
        const text = document.createElement('span');
        const name = document.createElement('strong');
        name.textContent = machine.label;
        const detail = document.createElement('small');
        detail.textContent = machine.source === 'tailscale' ? `Tailscale · ${machine.detail}` : machine.detail : [where[machine.source], machine.detail].filter(Boolean).join(' · ');
        text.append(name, detail);
        choice.append(text);
        if (machine.online !== undefined) {
          const dot = document.createElement('i');
          dot.className = machine.online ? 'dot on' : 'dot';
          dot.title = machine.online ? 'Online' : 'Offline';
          choice.append(dot);
        }
        choice.addEventListener('click', () => connect(machine.target));
        item.append(choice);
        list.append(item);
      }
    });
  </script>
</body>
</html>
